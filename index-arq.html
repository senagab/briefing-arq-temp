  function sortRooms(){
    rooms.sort(function(a,b){

  /* ---------------- Helpers ---------------- */
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function reg(k, l, s){ REG[k] = {l:l, s:s}; }

  function widget(w, sec, showLabel){
    reg(w.k, w.l, sec);
    var f = el('div','field'+(w.wide?' wide':''));
    if(showLabel!==false){ var lb = el(w.t==='text'||w.t==='area'?'label':'span', 'lbl', w.l); if(w.t==='text'||w.t==='area') lb.htmlFor='f-'+w.k; f.appendChild(lb); }
    var c;
    if(w.t==='text'){
      c = el('input','line'); c.type='text'; c.id='f-'+w.k; c.placeholder=w.ph||''; c.dataset.k=w.k;
      c.value = vals[w.k]||'';
      c.addEventListener('input', function(){ vals[w.k]=c.value; save(); });
    } else if(w.t==='area'){
      c = el('textarea','box'); c.id='f-'+w.k; c.placeholder=w.ph||''; c.dataset.k=w.k; if(w.tall) c.style.minHeight='170px';
      c.value = vals[w.k]||'';
      c.addEventListener('input', function(){ vals[w.k]=c.value; save(); });
    } else if(w.t==='seg'){
      c = el('div','seg'); c.setAttribute('role','group'); c.setAttribute('aria-label',w.l);
      w.o.forEach(function(o){
        var b = el('button',null,o); b.type='button'; b.setAttribute('aria-pressed', vals[w.k]===o?'true':'false');
        b.addEventListener('click', function(){
          vals[w.k] = vals[w.k]===o ? '' : o;
          Array.prototype.forEach.call(c.children, function(x){ x.setAttribute('aria-pressed', vals[w.k]===x.textContent?'true':'false'); });
          save();
        });
        c.appendChild(b);
      });
      if(w.volt){ var wrap = el('div','volt'); wrap.appendChild(c); c = wrap; }
    } else if(w.t==='multi'){
      c = el('div','chips');
      var cur = Array.isArray(vals[w.k]) ? vals[w.k] : [];
      w.o.forEach(function(o){
        var b = el('button','chip'); b.type='button'; b.innerHTML='<span class="dot"></span>'; b.appendChild(document.createTextNode(o));
        b.setAttribute('aria-pressed', cur.indexOf(o)>-1?'true':'false');
        b.addEventListener('click', function(){
          var arr = Array.isArray(vals[w.k]) ? vals[w.k].slice() : [];
          var i = arr.indexOf(o); if(i>-1) arr.splice(i,1); else arr.push(o);
          vals[w.k] = arr; b.setAttribute('aria-pressed', i>-1?'false':'true'); save();
        });
        c.appendChild(b);
      });
    }
    f.appendChild(c);
    return f;
  }

  function specRow(s, sec){
    var r = el('div','spec');
    r.appendChild(el('div','sname', s.l));
    var body = el('div','sbody');
    s.parts.forEach(function(p){
      reg(p.k, s.l+' / '+p.l, sec);
      var w = widget(p, sec, false);
      REG[p.k].l = s.l + (s.parts.length>1 ? ' ('+p.l.toLowerCase()+')' : '');
      if(p.t==='text'){ var inp = w.querySelector('input'); inp.setAttribute('aria-label', s.l+': '+p.l); body.appendChild(inp); }
      else body.appendChild(w.lastChild);
    });
    r.appendChild(body);
    return r;
  }

  /* ---------------- Render ---------------- */
  var formEl = document.getElementById('form');

  function renderHeader(){
    var d = document.getElementById('slot-data');
    d.appendChild(widget({t:'text',k:'hdr-data',l:'Data da reunião',ph:'dd/mm/aaaa'}, 'Identificação'));
    var s = document.getElementById('slot-strip');
    [{k:'hdr-resp',l:'Responsável técnico',ph:'Nome'},{k:'hdr-proc',l:'Nº do processo',ph:'Ex.: 2026-041'},{k:'hdr-etapa',l:'Etapa',ph:'Briefing inicial'}]
      .forEach(function(x){ x.t='text'; var cell = el('div'); cell.appendChild(widget(x,'Identificação')); s.appendChild(cell); });
  }

  function renderForm(){
    SECTIONS.forEach(function(sec, i){
      ORDER_SEC.push(sec);
      var s = el('section','section'); s.id = 'sec-'+sec.id;
      var h = el('div','section-head');
      h.appendChild(el('span','num', String(i+1).padStart(2,'0')));
      h.appendChild(el('h2',null,sec.title));
      h.appendChild(el('span','section-rule'));
      s.appendChild(h);
      if(sec.sub) s.appendChild(el('p','section-sub',sec.sub));
      if(sec.fields){ var g = el('div','grid'); sec.fields.forEach(function(f){ g.appendChild(widget(f, sec.title)); }); s.appendChild(g); }
      if(sec.specs){ var sp = el('div','specs'); sec.specs.forEach(function(x){ sp.appendChild(specRow(x, sec.title)); }); s.appendChild(sp); }
      if(sec.after){ var ga = el('div','grid'); ga.style.marginTop='18px'; sec.after.forEach(function(f){ f.wide=1; ga.appendChild(widget(f, sec.title)); }); s.appendChild(ga); }
      if(sec.custom==='programa') renderPrograma(s);
      if(sec.custom==='pontos'){ ptsWrapEl = el('div'); s.appendChild(ptsWrapEl); }
      formEl.appendChild(s);
    });
    var sig = el('div','sig-row');
    [['sig-cli','Assinatura do cliente'],['sig-resp','Assinatura do responsável técnico']].forEach(function(x){
      var d = el('div','sig'); d.appendChild(widget({t:'text',k:x[0],l:x[1],ph:''},'Assinaturas')); sig.appendChild(d);
    });

    var end = el('div','pdf-end');

    end.appendChild(pb);
    end.appendChild(el('p','legend','O PDF traz só os campos preenchidos, organizados por seção, com a tabela de pontos e espaço para assinaturas.'));
    formEl.appendChild(end);

  function renderPrograma(s){
    ROOM_GROUPS.forEach(function(g){
      var cat = el('div','picker-cat');
      cat.appendChild(el('span','cap',g.name));
      var chips = el('div','chips');
      g.items.forEach(function(r){
        var b = el('button','chip'); b.type='button'; b.innerHTML='<span class="dot"></span>'; b.appendChild(document.createTextNode(r[1]));
        b.addEventListener('click', function(){ toggleRoom(r[0]); });
        chipEls[r[0]] = b; chips.appendChild(b);
      });
      (g.rep||[]).forEach(function(r){
        var b = el('button','btn-add'); b.type='button';
        b.addEventListener('click', function(){ addRep(r[0]); });
        addBtns[r[0]] = b; chips.appendChild(b);
      });
      cat.appendChild(chips);
      s.appendChild(cat);
    });
    progListEl = el('div','prog-list');
    s.appendChild(progListEl);
  }

  function toggleRoom(id){
    var i = rooms.indexOf(id);
    if(i>-1) rooms.splice(i,1); else rooms.push(id);
    sortRooms(); refreshRooms(); save();
  }
  function addRep(base){
    seq[base] = (seq[base]||0)+1;
    rooms.push(base+'-'+seq[base]);
    sortRooms(); refreshRooms(); save();
  }
  function removeRoom(id){
    rooms.splice(rooms.indexOf(id),1);
    Object.keys(vals).forEach(function(k){ if(k.indexOf('p-'+id+'-')===0 || k.indexOf('t-'+id+'-')===0) delete vals[k]; });
    refreshRooms(); save();
  }

  function refreshRooms(){
    Object.keys(chipEls).forEach(function(id){ chipEls[id].setAttribute('aria-pressed', rooms.indexOf(id)>-1?'true':'false'); });
    Object.keys(addBtns).forEach(function(b){
      var n = rooms.filter(function(r){ return baseOf(r)===b; }).length;
      addBtns[b].textContent = '+ ' + LABEL[b] + (n ? ' ('+n+')' : '');
    });
    // Lista do programa
    progListEl.innerHTML = '';
    if(!rooms.length){ progListEl.appendChild(el('div','empty-note','Nenhum ambiente marcado ainda. Clique nos ambientes acima.')); }
    else {
      var head = el('div','prog-row prog-head');
      ['Ambiente','Dimensões','Observação',''].forEach(function(t){ head.appendChild(el('span','cap',t)); });
      progListEl.appendChild(head);
      rooms.forEach(function(id){
        var row = el('div','prog-row');
        var nm = roomName(id);
        row.appendChild(el('div','rname',nm));
        var dimW = {t:'text',k:'p-'+id+'-dim',l:nm+' / dimensões',ph: id==='garagem' ? 'Nº de carros / dimensões' : 'Ex.: 4,00 x 5,00 m'};
        var d = widget(dimW,'Programa de necessidades',false); d.querySelector('input').setAttribute('aria-label',nm+': dimensões'); row.appendChild(d);
        var o = widget({t:'text',k:'p-'+id+'-obs',l:nm+' / observação',ph:'Observação'},'Programa de necessidades',false); o.querySelector('input').setAttribute('aria-label',nm+': observação'); row.appendChild(o);
        var rm = el('button','btn-remove rm','×'); rm.type='button'; rm.setAttribute('aria-label','Remover '+nm);
        rm.addEventListener('click', function(){ if(REP[baseOf(id)]) removeRoom(id); else toggleRoom(id); });
        row.appendChild(rm);
        progListEl.appendChild(row);
      });
    }
    renderPontos();
  }

  function renderPontos(){
    ptsWrapEl.innerHTML = '';
    if(!rooms.length){ var e = el('div','table-wrap'); e.appendChild(el('div','empty-note','A tabela aparece quando houver ambientes marcados no programa de necessidades.')); ptsWrapEl.appendChild(e); return; }
    var wrap = el('div','table-wrap');
    var t = el('table','pts');
    var thead = el('thead'); var hr = el('tr');
    hr.appendChild(el('th',null,'Ambiente')); hr.appendChild(el('th',null,'Ar-condicionado'));
    PT_COLS.forEach(function(c){ hr.appendChild(el('th',null,c.l)); });
    thead.appendChild(hr); t.appendChild(thead);
    var tb = el('tbody');
    rooms.forEach(function(id){
      var nm = roomName(id);
      var tr = el('tr'); tr.appendChild(el('td',null,nm));
      var tdA = el('td'); var sel = el('select','sel'); sel.setAttribute('aria-label',nm+': ar-condicionado');
      AC_OPTS.forEach(function(o){ var op = el('option',null,o); op.value = o==='Nenhum'?'':o; sel.appendChild(op); });
      var kac = 't-'+id+'-ac'; sel.value = vals[kac]||'';
      sel.addEventListener('change', function(){ vals[kac]=sel.value; save(); });
      tdA.appendChild(sel); tr.appendChild(tdA);
      PT_COLS.forEach(function(c){
        var td = el('td'); var k = 't-'+id+'-'+c.k;
        var cb = el('input','ck'); cb.type='checkbox'; cb.checked = !!vals[k]; cb.setAttribute('aria-label', nm+': '+c.l);
        cb.addEventListener('change', function(){ vals[k] = cb.checked; save(); });
        td.appendChild(cb); tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t); ptsWrapEl.appendChild(wrap);
    ptsWrapEl.appendChild(el('p','legend','Água quente: ambientes atendidos pelo sistema de aquecimento. Forro gesso: previsão de teto rebaixado.'));
  }

  /* ---------------- Persistência ---------------- */
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({v:vals, rooms:rooms, seq:seq})); }catch(e){} }
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY); if(!raw) return;
      var d = JSON.parse(raw); vals = d.v||{}; rooms = d.rooms||[]; seq = d.seq||{};
    }catch(e){}
  }

  /* ---------------- Resumo ---------------- */
  function fmt(v){ if(Array.isArray(v)) return v.join(', '); if(v===true) return 'Sim'; return (v||'').toString().trim(); }
  /* Modelo único usado pelo resumo em texto e pelo PDF */
  function collect(){
    var bySec = {};
    Object.keys(REG).forEach(function(k){
      if(k.indexOf('p-')===0 || k.indexOf('sig-')===0) return;
      var v = fmt(vals[k]); if(!v) return;
      var s = REG[k].s; (bySec[s] = bySec[s]||[]).push([REG[k].l, v]);
    });
    var out = { id: bySec['Identificação']||[], sections: [] };
    SECTIONS.forEach(function(sec, i){
      var num = String(i+1).padStart(2,'0');
      if(sec.custom==='programa'){
        if(rooms.length) out.sections.push({num:num,title:sec.title,type:'table',
          head:['Ambiente','Dimensões','Observação'],
          body: rooms.map(function(id){ return [roomName(id), fmt(vals['p-'+id+'-dim']), fmt(vals['p-'+id+'-obs'])]; })});
      } else if(sec.custom==='pontos'){
        var body = rooms.map(function(id){
          return [roomName(id), vals['t-'+id+'-ac']||''].concat(PT_COLS.map(function(c){ return vals['t-'+id+'-'+c.k] ? 'X' : ''; }));
        }).filter(function(r){ return r.slice(1).some(Boolean); });
        if(body.length) out.sections.push({num:num,title:sec.title,type:'grid',
          head:['Ambiente','Ar-cond.'].concat(PT_COLS.map(function(c){ return c.l; })), body:body});
      } else if(bySec[sec.title]){
        out.sections.push({num:num,title:sec.title,type:'kv',rows:bySec[sec.title]});
      }
    });
    return out;
  }

  function buildSummary(){
    var d = collect(), out = ['BRIEFING DE PROJETO ARQUITETÔNICO · VIZZE',''];
    if(d.id.length) out.push(d.id.map(function(r){ return r[0]+': '+r[1]; }).join('\n'),'');
    d.sections.forEach(function(s){
      out.push(s.num+' '+s.title.toUpperCase());
      if(s.type==='kv') out.push(s.rows.map(function(r){ return r[0]+': '+r[1]; }).join('\n'));
      else if(s.type==='table') out.push(s.body.map(function(r){ var p=[r[1],r[2]].filter(Boolean); return '• '+r[0]+(p.length?': '+p.join(' · '):''); }).join('\n'));
      else out.push(s.body.map(function(r){
        var p=[]; if(r[1]) p.push('AC '+r[1]); PT_COLS.forEach(function(c,i){ if(r[i+2]) p.push(c.l); });
        return '• '+r[0]+': '+p.join(', ');
      }).join('\n'));
      out.push('');
    });
    return out.join('\n').trim();
  }

  /* ---------------- PDF ---------------- */
  var downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(null);
  function safeName(s){ return (s||'').replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim(); }

  function buildPdf(){
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({unit:'mm', format:'a4'});
    var W = 210, M = 16, INK = [38,39,31], SOFT = [110,111,98], LINE = [222,220,211], BAND = [230,230,223];
    var d = JSON.parse(JSON.stringify(collect()), function(k,v){ return typeof v==='string' ? v.replace(/²/g,'2').replace(/³/g,'3') : v; });

    // Cabeçalho
    try{ var lp = doc.getImageProperties(LOGO_SRC); doc.addImage(LOGO_SRC, 'PNG', M, 14, 32, 32*lp.height/lp.width); }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor.apply(doc, INK);
    doc.text('Briefing de Projeto Arquitetônico', M, 32);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor.apply(doc, SOFT);
    doc.text('PROGRAMA DE NECESSIDADES · RESIDENCIAL', M, 37);
    var dataRow = d.id.filter(function(r){ return r[0]==='Data da reunião'; })[0];
    if(dataRow){ doc.setFontSize(8); doc.text('DATA DA REUNIÃO', W-M, 26, {align:'right'}); doc.setFontSize(11); doc.setTextColor.apply(doc, INK); doc.text(dataRow[1], W-M, 32, {align:'right'}); }
    var strip = d.id.filter(function(r){ return r[0]!=='Data da reunião'; });
    var y = 42;
    if(strip.length){
      doc.setFillColor.apply(doc, BAND); doc.rect(M, y, W-2*M, 12, 'F');
      var cw = (W-2*M)/strip.length;
      strip.forEach(function(r,i){
        doc.setFontSize(6.5); doc.setTextColor.apply(doc, SOFT); doc.text(r[0].toUpperCase(), M+4+i*cw, y+4.5);
        doc.setFontSize(9.5); doc.setTextColor.apply(doc, INK); doc.text(doc.splitTextToSize(r[1], cw-6)[0], M+4+i*cw, y+9.5);
      });
      y += 12;
    }
    y += 8;

    var base = { margin:{left:M,right:M,top:18,bottom:18}, theme:'plain',
      styles:{font:'helvetica',fontSize:9,textColor:INK,cellPadding:{top:2,bottom:2,left:2,right:2},lineColor:LINE,lineWidth:{bottom:0.2}},
      headStyles:{fillColor:BAND,textColor:SOFT,fontSize:7,fontStyle:'bold'} };

    function heading(s){
      if(y > 262){ doc.addPage(); y = 20; }
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor.apply(doc, SOFT); doc.text(s.num, M, y);
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor.apply(doc, INK); doc.text(s.title, M+8, y);
      var tw = doc.getTextWidth(s.title);
      doc.setDrawColor.apply(doc, LINE); doc.setLineWidth(0.2); doc.line(M+11+tw, y-1.2, W-M, y-1.2);
      y += 3;
    }
    function after(){ y = doc.lastAutoTable.finalY + 9; }

    if(!d.sections.length){
      doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor.apply(doc, SOFT);
      doc.text('Nenhum campo preenchido.', M, y); y += 10;
    }
    d.sections.forEach(function(s){
      heading(s);
      if(s.type==='kv'){
        doc.autoTable(Object.assign({}, base, { startY:y, body:s.rows,
          columnStyles:{0:{cellWidth:62,textColor:SOFT,fontSize:8},1:{}} }));
      } else if(s.type==='table'){
        doc.autoTable(Object.assign({}, base, { startY:y, head:[s.head], body:s.body,
          columnStyles:{0:{cellWidth:52,fontStyle:'bold'},1:{cellWidth:48}} }));
      } else {
        doc.autoTable(Object.assign({}, base, { startY:y, head:[s.head], body:s.body,
          styles:Object.assign({}, base.styles, {fontSize:8, halign:'center'}),
          headStyles:Object.assign({}, base.headStyles, {halign:'center', fontSize:6.5}),
          columnStyles:{0:{halign:'left',fontStyle:'bold',cellWidth:44}},
          didParseCell:function(c){ if(c.column.index===0) c.cell.styles.halign='left'; } }));
      }
      after();
    });

    // Assinaturas
    if(y > 250){ doc.addPage(); y = 30; } else y += 16;
    var sw = (W-2*M-14)/2;
    [['Assinatura do cliente','sig-cli'],['Assinatura do responsável técnico','sig-resp']].forEach(function(s,i){
      var x = M + i*(sw+14);
      if(vals[s[1]]){ doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor.apply(doc, INK); doc.text(vals[s[1]], x, y-2); }
      doc.setDrawColor.apply(doc, SOFT); doc.setLineWidth(0.3); doc.line(x, y, x+sw, y);
      doc.setFontSize(7.5); doc.setTextColor.apply(doc, SOFT); doc.text(s[0].toUpperCase(), x, y+4.5);
    });

    // Rodapé
    var n = doc.getNumberOfPages();
    for(var p=1;p<=n;p++){
      doc.setPage(p); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor.apply(doc, SOFT);
      doc.text('Vizze Arquitetura & Engenharia · Alameda Iuca, 194 · Campo Grande, MS', M, 289);
      doc.text(p+' / '+n, W-M, 289, {align:'right'});
    }
    return doc;
  }

  function generatePdf(){
    var btn = document.getElementById('btn-pdf');
    if(!window.jspdf || !window.jspdf.jsPDF){ toast('Não foi possível carregar o gerador de PDF. Recarregue a página.'); return; }
    btn.disabled = true; btn.textContent = 'Gerando PDF…';
    var reset = function(){ btn.disabled = false; btn.textContent = 'Gerar PDF do briefing'; };
    var blob;
    try{ blob = buildPdf().output('blob'); }catch(e){ reset(); toast('Erro ao montar o PDF'); return; }
    var cli = safeName(vals['cli-nome']);
    var fname = 'Briefing Vizze' + (cli ? ' ' + cli : '') + '.pdf';
    downloadsP.then(function(dl){
      if(!dl){
        reset();
        if(!window.claude){ var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); toast('PDF gerado'); }
        else toast('Download de arquivos indisponível nesta visualização');
        return;
      }
      return dl.save({filename:fname, data:blob}).then(function(){ reset(); toast('PDF gerado'); }, function(err){
        reset();
        var c = err && err.code;
        if(c==='declined') return;
        toast(c==='rate_limited' ? 'Já existe um download aguardando confirmação' : 'Não foi possível salvar o PDF');
      });
    });
  }

  function toast(msg){
    var t = el('div','toast',msg); t.setAttribute('role','status'); document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
  }
  function showFallback(text){
    var old = document.getElementById('copy-fallback'); if(old) old.remove();
    var box = el('div','fallback field'); box.id='copy-fallback';
    box.appendChild(el('span','lbl','Resumo do briefing (selecione e copie)'));
    var ta = el('textarea','box'); ta.value = text; ta.readOnly = true; box.appendChild(ta);
    formEl.appendChild(box); ta.focus(); ta.select(); box.scrollIntoView({block:'center'});
  }
  document.getElementById('btn-copy').addEventListener('click', function(){
    var text = buildSummary();
    try{
      navigator.clipboard.writeText(text).then(function(){ toast('Resumo copiado'); }, function(){ showFallback(text); });
    }catch(e){ showFallback(text); }
  });

  var clearBtn = document.getElementById('btn-clear'), clearTimer = null;
  clearBtn.addEventListener('click', function(){
    if(!clearBtn.classList.contains('warn')){
      clearBtn.classList.add('warn'); clearBtn.textContent = 'Apagar tudo?';
      clearTimer = setTimeout(function(){ clearBtn.classList.remove('warn'); clearBtn.textContent='Novo briefing'; }, 3500);
      return;
    }
    clearTimeout(clearTimer);
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    vals = {}; rooms = []; seq = {};
    document.getElementById('slot-data').innerHTML=''; document.getElementById('slot-strip').innerHTML=''; formEl.innerHTML='';
    REG = {}; ORDER_SEC = []; chipEls = {}; addBtns = {};
    renderHeader(); renderForm(); refreshRooms();
    clearBtn.classList.remove('warn'); clearBtn.textContent='Novo briefing';
    window.scrollTo(0,0); toast('Briefing em branco');
  });

  load(); sortRooms(); renderHeader(); renderForm(); refreshRooms();
})();
</script>

</body></html>
